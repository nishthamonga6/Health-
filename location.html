<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📍 Smart Location Saver</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f8ff;
      margin: 0;
      padding: 2rem;
      color: #333;
      text-align: center;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    #map {
      height: 300px;
      width: 100%;
      max-width: 800px;
      margin: 1rem auto;
      border-radius: 12px;
      display: none;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .form {
      background: #fff;
      padding: 2rem;
      margin-top: 2rem;
      max-width: 600px;
      margin-inline: auto;
      text-align: left;
      border-radius: 16px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
    }

    .form h3 {
      margin-bottom: 1rem;
      color: #2c7be5;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 1rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    button {
      background: #2c7be5;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #1a5bc1;
    }

    #resultMsg {
      font-weight: bold;
      margin-top: 0.5rem;
    }

    @media (max-width: 600px) {
      .form, #map {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h2>📡 Detecting Your Location...</h2>
  <p id="locationDisplay">Hang tight...</p>
  <div id="map"></div>

  <div class="form">
    <h3>📝 Add Location Details</h3>
    <input type="text" id="manualLocation" placeholder="Enter manual location (optional)">
    <textarea id="additionalDetails" rows="3" placeholder="E.g. House no, landmark, nearby area..."></textarea>
    <button onclick="submitLocation()">📤 Submit Location</button>
    <p id="resultMsg"></p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    let lat = null, lng = null;

    window.onload = () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          lat = pos.coords.latitude;
          lng = pos.coords.longitude;

          document.getElementById("locationDisplay").innerText = `📍 Latitude: ${lat.toFixed(5)}, Longitude: ${lng.toFixed(5)}`;

          const map = L.map('map').setView([lat, lng], 13);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);

          L.marker([lat, lng]).addTo(map).bindPopup("You're here!").openPopup();

          const mapEl = document.getElementById("map");
          mapEl.style.display = "block";
          setTimeout(() => mapEl.style.opacity = 1, 100); // Smooth fade-in
        }, err => {
          document.getElementById("locationDisplay").innerText = "❌ Location access denied or unavailable.";
        });
      } else {
        document.getElementById("locationDisplay").innerText = "⚠️ Geolocation not supported.";
      }
    }

    function submitLocation() {
      const manual = document.getElementById("manualLocation").value.trim();
      const details = document.getElementById("additionalDetails").value.trim();
      const resultMsg = document.getElementById("resultMsg");

      if (!lat || !lng) {
        resultMsg.style.color = "red";
        resultMsg.innerText = "Location not detected yet.";
        return;
      }

      fetch('http://localhost:5000/api/location', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          manualLocation: manual,
          additionalDetails: details,
          latitude: lat,
          longitude: lng
        })
      })
      .then(res => res.json())
      .then(data => {
        resultMsg.style.color = "green";
        resultMsg.innerText = `✅ ${data.message}`;
      })
      .catch(err => {
        resultMsg.style.color = "red";
        resultMsg.innerText = "❌ Error saving location. Please try again.";
      });
    }
  </script>

</body>
</html>
