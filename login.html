<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Signup | Period Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-[#f1fafa] to-[#e0f1ff] min-h-screen flex items-center justify-center font-sans">

  <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
    <div class="flex justify-center mb-6 space-x-4">
      <button id="loginTab" class="tab-button text-[#5e8aa7] font-semibold border-b-2 border-[#5e8aa7] pb-1">Login</button>
      <button id="signupTab" class="tab-button text-gray-400 font-semibold pb-1">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="form active space-y-5">
      <div>
        <label class="block mb-1 text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="loginEmail" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-[#5e8aa7]" placeholder="example@mail.com" required>
      </div>
      <div>
        <label class="block mb-1 text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="loginPassword" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-[#5e8aa7]" placeholder="********" required>
      </div>
      <button type="submit" class="w-full bg-[#bfe3e1] text-gray-800 px-6 py-3 rounded-full hover:bg-[#aad9d7] transition font-medium">Login</button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="form hidden space-y-5">
      <div>
        <label class="block mb-1 text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="signupEmail" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-[#5e8aa7]" placeholder="example@mail.com" required>
      </div>
      <div>
        <label class="block mb-1 text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="signupPassword" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-[#5e8aa7]" placeholder="********" required>
      </div>
      <button type="submit" class="w-full bg-[#e2f7f4] text-gray-800 px-6 py-3 rounded-full hover:bg-[#c8efec] transition font-medium">Sign Up</button>
    </form>

    <!-- Message Display -->
    <p id="message" class="text-sm mt-4 text-center text-[#5e8aa7]"></p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const message = document.getElementById('message');
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');

    // Switch between Login and Signup tabs
    loginTab.addEventListener('click', () => {
      loginForm.classList.remove('hidden');
      signupForm.classList.add('hidden');
      loginTab.classList.add('text-[#5e8aa7]', 'border-b-2', 'border-[#5e8aa7]');
      signupTab.classList.remove('text-[#5e8aa7]', 'border-b-2', 'border-[#5e8aa7]');
    });

    signupTab.addEventListener('click', () => {
      signupForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      signupTab.classList.add('text-[#5e8aa7]', 'border-b-2', 'border-[#5e8aa7]');
      loginTab.classList.remove('text-[#5e8aa7]', 'border-b-2', 'border-[#5e8aa7]');
    });

    // Handle Login Form submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          message.textContent = data.message;
          setTimeout(() => {
            window.location.href = "index.html"; // Redirect to homepage after login
          }, 1000);
        } else {
          message.textContent = data.message;
        }
      } catch (error) {
        message.textContent = "❌ Something went wrong. Please try again.";
      }
    });

    // Handle Signup Form submission
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;

      try {
        const response = await fetch('http://localhost:3000/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          message.textContent = data.message;
          setTimeout(() => {
            window.location.href = "login.html"; // Redirect to login page after registration
          }, 1000);
        } else {
          message.textContent = data.message;
        }
      } catch (error) {
        message.textContent = "❌ Something went wrong. Please try again.";
      }
    });
  </script>

</body>
</html>
