<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Talk to a Gyno - GenZ Health</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-[#fefaff] to-[#f7f9fb] text-gray-800">
    <style>
    .filter-btn {
    @apply text-base px-8 py-3 rounded-full font-semibold shadow-md transition-all flex items-center gap-2;
    background: linear-gradient(to right, #fdfbff, #f1efff);
    color: #5a4bcf;
    border: 2px solid #ded9f9;
    box-shadow: 0 4px 12px rgba(90, 75, 207, 0.15);
    font-size: 1rem;
  }
  .filter-btn:hover {
    background: linear-gradient(to right, #ebe7ff, #f6f5ff);
    transform: translateY(-2px) scale(1.08);
    box-shadow: 0 8px 16px rgba(90, 75, 207, 0.25);
  }
  .clear-btn {
    @apply text-base px-8 py-3 rounded-full font-semibold shadow-md transition-all;
    background: linear-gradient(to right, #ffecec, #fff5f5);
    color: #d14949;
    border: 2px solid #f7cdcd;
    box-shadow: 0 4px 12px rgba(209, 73, 73, 0.15);
    font-size: 1rem;
  }
  .clear-btn:hover {
    background: linear-gradient(to right, #ffd4d4, #ffe2e2);
    transform: translateY(-2px) scale(1.08);
    box-shadow: 0 8px 16px rgba(209, 73, 73, 0.25);
  }
  .tag-btn {
    @apply bg-[#f3f0ff] text-[#5a4bcf] px-4 py-2 rounded-2xl text-sm font-medium hover:bg-[#e0dbff] transition;
  }
      </style>      
 <header class="text-center py-10 bg-gradient-to-br from-purple-100 to-white">
    <h1 class="text-5xl font-bold text-[#7b68ee] tracking-tight">💬 Talk to a Gyno</h1>
    <p class="mt-3 text-lg text-gray-600 max-w-2xl mx-auto">Real answers from expert gynecologists — no stigma, no filters.</p>
  </header>
  
  <!-- Search + Filter Section -->
  <section class="max-w-7xl mx-auto px-3 py-11">
  
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-5 mb-8">
      <input type="text" id="searchInput" placeholder="🔍 Search by name, experience, or topic..."
        class="w-full sm:w-1/2 px-5 py-3 border border-gray-300 rounded-2xl shadow-md focus:outline-none focus:ring-2 focus:ring-[#5a4bcf] placeholder:text-sm">
  
      <div class="flex flex-wrap gap-2 justify-center sm:justify-end">
        <button onclick="applyFilter('online')" class="tag-btn">🟢 Online Only</button>
        <button onclick="applyFilter('10+ years')" class="tag-btn">🏅 10+ Yrs Exp</button>
        <button onclick="applyFilter('PCOS')" class="tag-btn">💊 PCOS Expert</button>
        <button onclick="applyFilter('Teen')" class="tag-btn">👧 Teen-Friendly</button>
        <button onclick="applyFilter('PMS')" class="tag-btn">😵 PMS Expert</button>
        <button onclick="applyFilter('Fertility')" class="tag-btn">🌸 Fertility</button>
        <button onclick="clearFilter()" class="tag-btn bg-gray-200 text-gray-600 hover:bg-gray-300">❌ Clear</button>
      </div>
    </div>
  
    <!-- Dynamic Gyno Cards List -->
    <div id="gynoList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Cards dynamically injected here -->
    </div>
  </section>
  
  <!-- Q&A Section -->
  <section class="bg-white border-t border-purple-100 py-12 px-6">
    <h2 class="text-3xl font-bold text-[#6a5acd] mb-6 text-center">📝 Ask Your Question</h2>
  
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 max-w-3xl mx-auto mb-8">
      <input id="questionInput" type="text" placeholder="💬 What’s on your mind?"
        class="flex-1 border border-purple-300 rounded-2xl p-4 shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-[#7b68ee] placeholder:text-gray-500">
      <button onclick="submitQuestion()"
        class="bg-[#7b68ee] text-white px-6 py-2 rounded-2xl hover:bg-[#6a5acd] transition font-semibold">
        Ask
      </button>
    </div>
  
    <ul id="recentQuestions" class="space-y-4 max-w-4xl mx-auto">
      <!-- User questions dynamically added here -->
    </ul>
  </section>
  <!-- Floating Chat Bubble -->
<div id="chatToggle" class="fixed bottom-6 right-6 z-50 bg-[#7b68ee] hover:bg-[#6a5acd] text-white rounded-full p-4 shadow-lg cursor-pointer transition">
    💬
  </div>
  
  <!-- Chat Window -->
  <div id="chatBox" class="fixed bottom-20 right-6 w-80 bg-white border border-purple-300 rounded-2xl shadow-2xl hidden flex flex-col z-50">
    <div class="bg-[#7b68ee] text-white px-4 py-3 rounded-t-2xl flex justify-between items-center">
      <h4 class="font-semibold">GenZ Gyno Assistant</h4>
      <button onclick="toggleChat()" class="text-white">✖</button>
    </div>
  
    <div id="chatMessages" class="p-4 overflow-y-auto space-y-3 max-h-80 text-sm">
      <div class="text-left bg-purple-100 rounded-lg p-2">👋 Hi there! I'm your virtual Gyno Assistant. How can I help?</div>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="sendQuickReply('What are common PMS symptoms?')" class="bg-purple-200 px-2 py-1 rounded-full text-xs hover:bg-purple-300">PMS?</button>
        <button onclick="sendQuickReply('Is irregular period normal?')" class="bg-purple-200 px-2 py-1 rounded-full text-xs hover:bg-purple-300">Irregular Period?</button>
        <button onclick="sendQuickReply('Best hygiene tips during periods?')" class="bg-purple-200 px-2 py-1 rounded-full text-xs hover:bg-purple-300">Hygiene Tips</button>
        <button onclick="sendQuickReply('How to manage period pain?')" class="bg-purple-200 px-2 py-1 rounded-full text-xs hover:bg-purple-300">Pain Relief</button>
        <button onclick="sendQuickReply('How can I delay my period naturally?')" class="bg-purple-200 px-2 py-1 rounded-full text-xs hover:bg-purple-300">Delay Period</button>
        <button onclick="sendQuickReply('What are early signs of pregnancy?')" class="bg-purple-200 px-2 py-1 rounded-full text-xs hover:bg-purple-300">Pregnancy Signs</button>
        <button onclick="sendQuickReply('Can stress affect my period?')" class="bg-purple-200 px-2 py-1 rounded-full text-xs hover:bg-purple-300">Stress & Period</button>
        <button onclick="sendQuickReply('Is white discharge normal?')" class="bg-purple-200 px-2 py-1 rounded-full text-xs hover:bg-purple-300">Discharge?</button>
        <button onclick="sendQuickReply('How do I use a menstrual cup?')" class="bg-purple-200 px-2 py-1 rounded-full text-xs hover:bg-purple-300">Menstrual Cup</button>
        <button onclick="sendQuickReply('Why do I get acne before periods?')" class="bg-purple-200 px-2 py-1 rounded-full text-xs hover:bg-purple-300">Period Acne</button>
        <button onclick="sendQuickReply('Can I swim or exercise during periods?')" class="bg-purple-200 px-2 py-1 rounded-full text-xs hover:bg-purple-300">Exercise/Sports</button>
        <button onclick="sendQuickReply('Is it safe to take painkillers during periods?')" class="bg-purple-200 px-2 py-1 rounded-full text-xs hover:bg-purple-300">Painkillers Safe?</button>
        <button onclick="sendQuickReply('When should I see a gynecologist?')" class="bg-purple-200 px-2 py-1 rounded-full text-xs hover:bg-purple-300">See a Gyno?</button>

      </div>
    </div>
  
    <div class="border-t border-purple-100 flex items-center px-4 py-3">
      <input id="chatInput" type="text" placeholder="Type here..." class="flex-1 text-sm p-2 border border-gray-200 rounded-lg mr-2 focus:outline-none">
      <button onclick="sendMessage()" class="bg-[#7b68ee] text-white px-3 py-1 rounded hover:bg-[#6a5acd]">➤</button>
    </div>
  </div>
  <!-- NORMAL Ask Bar (default) -->
<div id="normalAskBar" class="flex flex-col sm:flex-row gap-4 mb-6">
    <input id="questionInput" type="text" placeholder="Type your question..."
      class="flex-1 border border-purple-300 rounded-xl p-3 shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-[#7b68ee]">
    <button onclick="submitQuestion()" class="bg-[#7b68ee] text-white px-5 py-2 rounded-xl hover:bg-[#6a5acd] transition">Ask</button>
  </div>
  
  <!-- Anonymously Ask Toggle -->
  <div class="flex items-center space-x-3 mb-4">
    <label for="anonToggle" class="text-sm font-medium text-gray-700 flex items-center gap-2">
      🙈 Ask Anonymously?
    </label>
  
    <label class="relative inline-flex items-center cursor-pointer">
      <input type="checkbox" id="anonToggle" class="sr-only peer" onchange="activateAnonymousMode()">
      <div class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:bg-[#7b68ee] transition-all"></div>
      <div class="absolute left-0.5 top-0.5 bg-white w-5 h-5 rounded-full transition-all peer-checked:translate-x-full shadow-md"></div>
    </label>
  </div>
  
  <!-- Anonymous Ask Bar (hidden initially) -->
  <div id="anonymousOverlay" class="hidden fixed inset-0 bg-[#0f172a] bg-opacity-95 flex items-center justify-center z-50 transition-all duration-300">
    <div class="w-full max-w-xl px-6">
      <input id="anonQuestionInput" type="text" placeholder="Ask anonymously..."
        class="w-full p-4 text-white text-lg bg-[#1e293b] border border-purple-500 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#7b68ee] placeholder:text-gray-400 shadow-lg">
      <button onclick="submitAnonymousQuestion()"
        class="w-full mt-4 bg-purple-600 text-white py-2 rounded-xl hover:bg-purple-700 transition">🚀 Send Anonymously</button>
    </div>
  </div>
  
  <!-- Questions List -->
  <ul id="recentQuestions" class="space-y-4 mt-8"></ul>
      
  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-6 px-4 sm:px-8 lg:px-20 mt-20">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between text-sm text-gray-600">
      <div class="mb-3 sm:mb-0 text-center sm:text-left">
        © 2025 <span class="font-semibold text-[#6a5acd]">GenZ Health</span>. All rights reserved.
      </div>
      <div class="flex space-x-4">
        <a href="#teen-corner" class="hover:text-[#6a5acd] transition">Teen Corner</a>
        <a href="#gynoList" class="hover:text-[#6a5acd] transition">Talk to Gyno</a>
        <a href="track.html" class="hover:text-[#6a5acd] transition">Cycle Tracker</a>
        <a href="#" class="hover:text-[#6a5acd] transition">Contact</a>
      </div>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="gyno.js">
  
  </script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js"></script>
</body>
</html>
